name: PyPhone source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-runtime-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Host dependency pins live in this workflow, not iOS requirements.txt.
          cache-dependency-path: .github/workflows/quality.yml
      - name: Install host NumPy and HeliOS for runtime tests
        run: |
          python -m pip install --only-binary=:all: "numpy==2.3.5" "helios-image==0.3.0"
      - name: Compile Python sources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyphone-pycache
        run: python -m py_compile app/runner.py app/ui.py scripts/test_runtime.py scripts/test_contracts.py scripts/test_regressions.py
      - name: Test cross-file interfaces and build resources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyphone-pycache
        run: python scripts/test_contracts.py
      - name: Test runner, UI callbacks, input, and error output
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyphone-pycache
        run: |
          python scripts/test_runtime.py
          python scripts/test_regressions.py


  ios-scrolling-tests:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Start iPhone simulator while preparing the test build
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          SIMULATOR_SELECTION="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PYCODE'
          import json, sys
          data = json.load(open(sys.argv[1]))
          devices = [d for group in data["devices"].values() for d in group
                     if d.get("isAvailable") and d["name"].startswith("iPhone")]
          assert devices, "No iPhone simulator is installed"
          selected = next((d for d in devices if d["state"] == "Booted"), devices[0])
          print(selected["udid"] + "\t" + selected["state"])
          PYCODE
          )"
          IFS=$'\t' read -r SIMULATOR_ID SIMULATOR_STATE <<< "$SIMULATOR_SELECTION"
          printf 'PYPHONE_SIMULATOR_ID=%s\n' "$SIMULATOR_ID" >> "$GITHUB_ENV"
          # simctl boot returns before startup completes. Let startup overlap
          # XcodeGen and compilation; xcodebuild still waits for test readiness.
          if [ "$SIMULATOR_STATE" != "Booted" ]; then
            if ! xcrun simctl boot "$SIMULATOR_ID"; then
              # Accept only the harmless race where the selected device has
              # already booted. All other boot errors must fail the job.
              xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators-after-boot.json"
              python3 - "$RUNNER_TEMP/simulators-after-boot.json" "$SIMULATOR_ID" <<'PYCODE'
          import json, sys
          data = json.load(open(sys.argv[1]))
          devices = [d for group in data["devices"].values() for d in group]
          selected = next(d for d in devices if d["udid"] == sys.argv[2])
          assert selected["state"] == "Booted", "Simulator boot failed: " + selected["state"]
          PYCODE
            fi
          fi
      - name: Prepare scrolling test project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec scrolling-tests.yml
      - name: Test workspace, saved scripts, editor, and console
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project ScrollingChecks.xcodeproj -scheme ScrollingChecks \
            -destination "platform=iOS Simulator,id=$PYPHONE_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/PyPhone-UI.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/PyPhone-UI.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/PyPhone-UI.xcresult" --output-path "$RUNNER_TEMP/pyphone-screenshots"
          fi
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyphone-v2-ui
          path: ${{ runner.temp }}/pyphone-screenshots/
          if-no-files-found: ignore

