name: PyPhone source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-runtime-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host NumPy for runtime tests
        run: |
          python -m pip install --only-binary=:all: "numpy==2.3.5"
      - name: Compile Python sources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyphone-pycache
        run: python -m py_compile app/runner.py app/ui.py scripts/test_runtime.py scripts/test_contracts.py
      - name: Test cross-file interfaces and build resources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyphone-pycache
        run: python scripts/test_contracts.py
      - name: Test runner, UI callbacks, input, and error output
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyphone-pycache
        run: python scripts/test_runtime.py
