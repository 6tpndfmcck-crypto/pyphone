name: Build pyUI package

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/pyui/**"
      - ".github/workflows/pyui-package.yml"
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pyui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Run pyUI smoke tests
        run: |
          PYTHONPATH=src python - <<'PY'
          import base64
          import io
          import pyui
          assert pyui.__version__ == "0.1.0"
          assert pyui.label("hello").get() == "hello"
          field = pyui.entry("name", "Ada")
          assert field.get() == "Ada"
          field.set("Grace")
          assert field.get() == "Grace"
          called = []
          pyui.button("click", lambda: called.append(True))
          button = pyui._widgets[-1]
          pyui._event(button.id, "tap")
          assert called == [True]
          class TestImage:
              size = (1, 1)
              def save(self, target, format=None):
                  target.write(b"\\x89PNG\\r\\n\\x1a\\n")
          image = pyui.image(TestImage())
          assert base64.b64decode(image.image_data).startswith(b"\\x89PNG")
          assert len(pyui._state()) == 4
          pyui.clear()
          assert pyui._state() == []
          print("pyUI smoke tests passed")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: pyui-toolkit-distributions
          path: packages/pyui/dist/*
          if-no-files-found: error
