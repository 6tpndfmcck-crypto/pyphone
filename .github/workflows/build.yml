name: Build iOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo beeware/Python-Apple-support --limit 100 --json tagName --jq '.[].tagName' | grep '^3\.13-' | head -1)
          echo "Using release: $TAG"
          gh release download "$TAG" --repo beeware/Python-Apple-support --pattern 'Python-3.13-iOS-support.*.tar.gz'
          mkdir -p py
          tar -xzf Python-3.13-iOS-support.*.tar.gz -C py
          X=$(find py -maxdepth 3 -name Python.xcframework -type d | head -1)
          mv "$X" ./Python.xcframework
          echo "--- Python.xcframework contents ---"
          ls -la Python.xcframework
          test -f Python.xcframework/Info.plist || { echo "Python.xcframework/Info.plist missing"; exit 1; }

      - name: Show package layout for some reason
        run: |
          echo "--- directory layout ---"
          find Python.xcframework -maxdepth 4 -type d | head -60
          echo "--- where is encodings? ---"
          find Python.xcframework -type d -name encodings | head

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build ipa
        run: |
          xcodebuild -project CodeWindow.xcodeproj \
            -scheme CodeWindow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Verify stdlib in app
        run: |
          APP=build/Build/Products/Release-iphoneos/CodeWindow.app
          echo "--- python/lib ---"
          ls "$APP/python/lib"
          test -d "$APP/python/lib/python3.13/encodings" || { echo "encodings missing from app"; exit 1; }
          test -f "$APP/python/lib/python3.13/os.py" || { echo "os.py missing from app"; exit 1; }

      - name: finish IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CodeWindow.app Payload/
          zip -qr PythonWindow.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PythonWindow-ipa
          path: PythonWindow.ipa
