name: PyPhone iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyphone-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Cache SDL2 framework
        uses: actions/cache@v4
        with:
          path: SDL2.xcframework
          key: pyphone-sdl2-${{ runner.os }}-${{ hashFiles('scripts/build_sdl2_xcframework.sh') }}

      - name: Cache prepared Python runtime
        id: python-runtime
        uses: actions/cache@v4
        with:
          path: |
            Python.xcframework
            python-stdlib
          # An exact key also invalidates the cache if staging commands change.
          key: pyphone-runtime-v1-${{ runner.os }}-${{ runner.arch }}-py313-b16-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Build SDL2 framework for the IPA
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f SDL2.xcframework/Info.plist ]; then
            bash scripts/build_sdl2_xcframework.sh
          else
            echo "Using cached SDL2.xcframework"
          fi
          test -f SDL2.xcframework/Info.plist
          plutil -lint SDL2.xcframework/Info.plist
          echo "SDL2.xcframework is ready to be embedded in PyPhone.app"

      - name: Cache Python support archive
        if: steps.python-runtime.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: Python-3.13-iOS-support.tar.gz
          key: pyphone-python-support-3.13-b16

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pyphone-pip-cache
          key: pyphone-pip-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt', '.github/workflows/build.yml') }}
          restore-keys: |
            pyphone-pip-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache installed iOS Python packages
        uses: actions/cache@v4
        with:
          path: app_packages
          key: pyphone-app-packages-v2-${{ runner.os }}-${{ runner.arch }}-py313-b16-${{ hashFiles('requirements.txt', '.github/workflows/build.yml') }}

      - name: Install build tools
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "Using preinstalled xcodegen"
          fi
          if ! command -v python3.13 >/dev/null 2>&1; then
            brew install python@3.13
          else
            echo "Using available Python 3.13: $(command -v python3.13)"
          fi
          # Native module caches and venvs must not cross SDK, runner-image,
          # Python installation, or architecture changes.
          TOOLCHAIN_KEY="$(
            {
              xcodebuild -version
              xcrun --sdk iphoneos --show-sdk-version
              xcrun --sdk iphoneos --show-sdk-build-version
              python3.13 -c 'import os, sys; print(sys.version); print(sys.executable); print(os.path.realpath(sys.executable))'
              printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            } | shasum -a 256 | cut -d ' ' -f 1
          )"
          echo "cache-key=$TOOLCHAIN_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache host test environment
        id: host-python
        uses: actions/cache@v4
        with:
          path: .build-venv
          key: pyphone-host-venv-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('requirements.txt', '.github/workflows/build.yml') }}

      - name: Cache compiler modules
        uses: actions/cache@v4
        with:
          # No app products or target object files are cached. Xcode still
          # validates these SDK modules before compiling the current sources.
          path: |
            build/ModuleCache.noindex
            build/Build/Intermediates.noindex/ExplicitPrecompiledModules
          key: pyphone-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('project.yml', 'sources/*.h', 'requirements.txt', '.github/workflows/build.yml') }}

      - name: Prepare Python runtime and NumPy
        env:
          # Use one explicit pip cache for host and cross-platform downloads.
          PIP_CACHE_DIR: ${{ runner.temp }}/pyphone-pip-cache
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python3.13)"
          "$PYTHON_BIN" --version
          if [ "${{ steps.python-runtime.outputs.cache-hit }}" != "true" ]; then
            rm -rf py Python.xcframework python-stdlib
            mkdir -p py
            ASSET_URL="https://github.com/beeware/Python-Apple-support/releases/download/3.13-b16/Python-3.13-iOS-support.b16.tar.gz"
            echo "Downloading Python support archive: $ASSET_URL"
            if [ ! -s Python-3.13-iOS-support.tar.gz ]; then
              curl -fL "$ASSET_URL" -o Python-3.13-iOS-support.tar.gz
            else
              echo "Using cached Python support archive"
            fi
            tar -xzf Python-3.13-iOS-support.tar.gz -C py

            XCF="$(find py -maxdepth 7 -name Python.xcframework -type d -print -quit)"
            if [ -z "$XCF" ]; then
              echo "Python.xcframework not found in support archive."
              exit 1
            fi
            mv "$XCF" ./Python.xcframework
            test -f Python.xcframework/Info.plist

            ENCODINGS="$(find py -type f -path '*/encodings/__init__.py' ! -path '*/Python.xcframework/*' -print -quit)"
            if [ -z "$ENCODINGS" ]; then
              for CANDIDATE in \
                "Python.xcframework/lib/python3.13/encodings/__init__.py" \
                "Python.xcframework/ios-arm64/lib-arm64/python3.13/encodings/__init__.py" \
                "Python.xcframework/ios-arm64/lib/python3.13/encodings/__init__.py"; do
                if [ -f "$CANDIDATE" ]; then ENCODINGS="$CANDIDATE"; break; fi
              done
            fi
            if [ -z "$ENCODINGS" ]; then
              echo "Could not find device-compatible encodings/__init__.py."
              find py Python.xcframework -type f -path '*/encodings/__init__.py' -print | head -30
              exit 1
            fi
            STDLIB="${ENCODINGS%/encodings/__init__.py}"
            mkdir -p python-stdlib/python3.13
            rsync -a --exclude='lib-dynload/' "$STDLIB/" python-stdlib/python3.13/
          else
            echo "Using cached prepared Python runtime"
          fi
          test -f Python.xcframework/Info.plist
          test -f python-stdlib/python3.13/encodings/__init__.py
          test -f python-stdlib/python3.13/datetime.py
          find Python.xcframework/ios-arm64 -type f -name 'math*.so' -print -quit | grep -q .

          if [ "${{ steps.host-python.outputs.cache-hit }}" != "true" ]; then
            rm -rf .build-venv
            "$PYTHON_BIN" -m venv .build-venv
          fi
          BUILD_PYTHON="$PWD/.build-venv/bin/python"
          mkdir -p app_packages
          if [ ! -f app_packages/numpy/__init__.py ]; then
            "$BUILD_PYTHON" -m pip install --upgrade pip
            "$BUILD_PYTHON" -m pip install -r requirements.txt \
              --target app_packages \
              --platform ios_13_0_arm64_iphoneos \
              --implementation cp --python-version 3.13 --abi cp313 \
              --only-binary=:all: \
              --extra-index-url https://pypi.anaconda.org/beeware/simple
            rm -rf app_packages/bin
          else
            echo "Using cached iOS Python packages"
          fi
          test -f app_packages/numpy/__init__.py

          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX=/tmp/pyphone-pycache
          rm -rf "$PYTHONPYCACHEPREFIX"
          if [ "${{ steps.host-python.outputs.cache-hit }}" != "true" ]; then
            "$BUILD_PYTHON" -m pip install --only-binary=:all: "numpy==2.3.5" "helios-image==0.3.0"
          else
            echo "Using cached host NumPy and HeliOS test environment"
          fi
          "$BUILD_PYTHON" -m py_compile app/runner.py app/ui.py scripts/test_runtime.py scripts/test_contracts.py scripts/test_regressions.py
          "$BUILD_PYTHON" scripts/test_contracts.py
          "$BUILD_PYTHON" scripts/test_runtime.py
          "$BUILD_PYTHON" scripts/test_regressions.py
          test -f app_packages/numpy/__init__.py
          find app_packages/numpy -type f -name '*.so' -print -quit | grep -q .
          echo "Python runtime tests and NumPy package checks passed."

      - name: Generate app icons and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -s icon.png
          mkdir -p sources/Assets.xcassets/AppIcon.appiconset
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          source = Path("icon.png")
          root = Path("sources/Assets.xcassets")
          iconset = root / "AppIcon.appiconset"
          specs = [
              ("iphone", "20x20", 2), ("iphone", "20x20", 3),
              ("iphone", "29x29", 2), ("iphone", "29x29", 3),
              ("iphone", "40x40", 2), ("iphone", "40x40", 3),
              ("iphone", "60x60", 2), ("iphone", "60x60", 3),
              ("ipad", "20x20", 1), ("ipad", "20x20", 2),
              ("ipad", "29x29", 1), ("ipad", "29x29", 2),
              ("ipad", "40x40", 1), ("ipad", "40x40", 2),
              ("ipad", "76x76", 1), ("ipad", "76x76", 2),
              ("ipad", "83.5x83.5", 2), ("ios-marketing", "1024x1024", 1),
          ]
          images = []
          for idiom, size, scale in specs:
              filename = ("AppIcon-marketing-1024.png" if idiom == "ios-marketing"
                          else f"AppIcon-{idiom}-{size.replace('x','-')}@{scale}x.png")
              pixels = round(float(size.split("x")[0]) * scale)
              subprocess.run(["sips", "-z", str(pixels), str(pixels), str(source),
                              "--out", str(iconset / filename)], check=True,
                             stdout=subprocess.DEVNULL)
              images.append({"filename": filename, "idiom": idiom,
                             "scale": f"{scale}x", "size": size})
          (root / "Contents.json").write_text(
              json.dumps({"info": {"author": "xcode", "version": 1}}, indent=2) + "\n")
          (iconset / "Contents.json").write_text(
              json.dumps({"images": images, "info": {"author": "xcode", "version": 1}}, indent=2) + "\n")
          print(f"Generated {len(images)} app icon sizes from icon.png")
          PY
          xcodegen generate

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          # Keep only SDK/compiler module caches. App products, target objects,
          # build descriptions, and packaged Python frameworks start fresh.
          mkdir -p build/Build/Intermediates.noindex
          find build -mindepth 1 -maxdepth 1 ! -name ModuleCache.noindex ! -name Build -exec rm -rf {} +
          find build/Build -mindepth 1 -maxdepth 1 ! -name Intermediates.noindex -exec rm -rf {} +
          find build/Build/Intermediates.noindex -mindepth 1 -maxdepth 1 ! -name ExplicitPrecompiledModules -exec rm -rf {} +
          set -o pipefail
          xcodebuild \
            -project PyPhone.xcodeproj \
            -scheme PyPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee xcodebuild.log
          test -d "build/Build/Products/Release-iphoneos/PyPhone.app"

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/PyPhone.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          plutil -lint "$APP_PATH/Info.plist"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          echo "Verifying PyPhone version: $APP_VERSION"
          test "$APP_VERSION" = "2.0.0"
          test -f "$APP_PATH/Frameworks/SDL2.framework/SDL2" || {
            echo "SDL2.framework was not embedded in PyPhone.app"
            find "$APP_PATH/Frameworks" -maxdepth 2 -iname '*sdl*' -print
            exit 1
          }
          test -f "$APP_PATH/python/lib/python3.13/encodings/__init__.py"
          test -f "$APP_PATH/python/lib/python3.13/datetime.py"
          test -f "$APP_PATH/app_packages/numpy/__init__.py"
          test -f "$APP_PATH/app_packages/numpy/_core/__init__.py"

          for module in math _datetime; do
            test -f "$APP_PATH/Frameworks/$module.framework/$module" || {
              echo "Python native framework is missing: $module"
              find "$APP_PATH/Frameworks" -maxdepth 1 \( -iname '*math*' -o -iname '*datetime*' \) -print
              exit 1
            }
            find "$APP_PATH/python/lib/python3.13/lib-dynload" -maxdepth 1 -type f -name "$module*.fwork" -print -quit | grep -q .
          done
          find "$APP_PATH/app_packages/numpy" -type f -name '*.fwork' -print -quit | grep -q .

          while IFS= read -r -d '' marker; do
            target="$(cat "$marker")"
            case "$target" in Frameworks/*.framework/*) ;; *) echo "Invalid framework target: $target"; exit 1 ;; esac
            test -f "$APP_PATH/$target"
            test -f "$APP_PATH/$target.origin"
            origin="$(cat "$APP_PATH/$target.origin")"
            test -f "$APP_PATH/$origin"
          done < <(find "$APP_PATH/python/lib/python3.13/lib-dynload" "$APP_PATH/app_packages" -type f -name '*.fwork' -print0)

          if find "$APP_PATH/python/lib/python3.13/lib-dynload" "$APP_PATH/app_packages" -type f -name '*.so' -print -quit | grep -q .; then
            echo "A native .so module was left outside Frameworks."
            exit 1
          fi
          find "$APP_PATH/Frameworks" -maxdepth 1 -name 'numpy*framework' -print | grep -q .

          rm -rf Payload PyPhone.ipa PyPhone_ipa.zip
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PyPhone.ipa Payload
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          ipa = Path("PyPhone.ipa")
          archive = Path("PyPhone_ipa.zip")
          original_hash = hashlib.sha256(ipa.read_bytes()).hexdigest()
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED) as zf:
              zf.write(ipa, arcname="PyPhone.ipa")
          with zipfile.ZipFile(archive, "r") as zf:
              assert zf.namelist() == ["PyPhone.ipa"], zf.namelist()
              assert zf.testzip() is None, "Outer ZIP CRC verification failed"
              extracted = zf.read("PyPhone.ipa")
          assert hashlib.sha256(extracted).hexdigest() == original_hash
          print("Outer ZIP verified; embedded IPA matches byte-for-byte.")
          PY
          unzip -tq PyPhone.ipa
          unzip -Z1 PyPhone.ipa | grep -Fxq "Payload/PyPhone.app/Info.plist"
          unzip -tq PyPhone_ipa.zip
          unzip -Z1 PyPhone_ipa.zip | grep -Fxq "PyPhone.ipa"
          unzip -p PyPhone_ipa.zip PyPhone.ipa > "$RUNNER_TEMP/PyPhone_check.ipa"
          unzip -tq "$RUNNER_TEMP/PyPhone_check.ipa"
          unzip -Z1 "$RUNNER_TEMP/PyPhone_check.ipa" | grep -Fxq "Payload/PyPhone.app/Info.plist"
          shasum -a 256 PyPhone.ipa PyPhone_ipa.zip > PyPhone_SHA256.txt
          ls -lh PyPhone.ipa PyPhone_ipa.zip PyPhone_SHA256.txt

      - name: Stage and verify downloadable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find . -maxdepth 5 -type f \( -name 'PyPhone_ipa.zip' -o -name 'PyPhone.ipa' -o -name 'PyPhone_SHA256.txt' -o -name 'xcodebuild.log' \) -not -path './artifacts/*' -print
          for file in PyPhone_ipa.zip PyPhone_SHA256.txt xcodebuild.log; do
            if [ -f "$file" ]; then cp "$file" artifacts/; fi
          done
          echo "Files staged for upload:"
          ls -lah artifacts
          if [ ! -s artifacts/PyPhone_ipa.zip ]; then
            echo "ERROR: PyPhone_ipa.zip was not created; the build/package step did not produce the expected download."
            exit 1
          fi
          unzip -tq artifacts/PyPhone_ipa.zip
          unzip -Z1 artifacts/PyPhone_ipa.zip | grep -Fxq "PyPhone.ipa"

      - name: Upload PyPhone IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyphone
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pyphone-build-logs
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7


