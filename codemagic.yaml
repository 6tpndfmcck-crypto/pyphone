workflows:
  ios-build:
    name: PyPhone iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: get build tools
        script: |
          set -euo pipefail
          brew install xcodegen python@3.13

      - name: get python and numpy
        script: |
          set -euo pipefail

          PYTHON_BIN="$(brew --prefix python@3.13)/bin/python3.13"
          "$PYTHON_BIN" --version

          # Use the known release URL directly to avoid GitHub API rate limits.
          ASSET_URL="https://github.com/beeware/Python-Apple-support/releases/download/3.13-b16/Python-3.13-iOS-support.b16.tar.gz"

          echo "Downloading Python support archive: $ASSET_URL"
          curl -fL "$ASSET_URL" -o Python-3.13-iOS-support.tar.gz
          mkdir -p py
          tar -xzf Python-3.13-iOS-support.tar.gz -C py

          XCF="$(find py -maxdepth 7 -name Python.xcframework -type d -print -quit)"
          if [ -z "$XCF" ]; then
            echo "Python.xcframework not found in support archive."
            exit 1
          fi
          mv "$XCF" ./Python.xcframework
          test -f Python.xcframework/Info.plist

          # Prefer the support archive's standalone pure-Python library. If
          # the release only includes it inside the XCFramework, use the
          # iPhone device slice specifically. Never stage another architecture's
          # native extensions as the app's standard library.
          ENCODINGS="$(find py -type f -path '*/encodings/__init__.py' ! -path '*/Python.xcframework/*' -print -quit)"
          if [ -z "$ENCODINGS" ]; then
            for CANDIDATE in \
              "Python.xcframework/ios-arm64/lib-arm64/python3.13/encodings/__init__.py" \
              "Python.xcframework/ios-arm64/lib/python3.13/encodings/__init__.py"; do
              if [ -f "$CANDIDATE" ]; then
                ENCODINGS="$CANDIDATE"
                break
              fi
            done
          fi
          if [ -z "$ENCODINGS" ]; then
            echo "Could not find device-compatible encodings/__init__.py in the support archive."
            find py Python.xcframework -type f -path '*/encodings/__init__.py' -print | head -30
            exit 1
          fi
          STDLIB="${ENCODINGS%/encodings/__init__.py}"
          rm -rf python-stdlib/python3.13
          mkdir -p python-stdlib/python3.13
          rsync -a --exclude='lib-dynload/' "$STDLIB/" python-stdlib/python3.13/
          test -f python-stdlib/python3.13/encodings/__init__.py

          # Use an isolated virtual environment so Homebrew's PEP 668
          # externally-managed-environment protection is not triggered.
          "$PYTHON_BIN" -m venv .build-venv
          BUILD_PYTHON="$PWD/.build-venv/bin/python"
          mkdir -p app_packages
          "$BUILD_PYTHON" -m pip install --upgrade pip
          "$BUILD_PYTHON" -m pip install -r requirements.txt \
            --target app_packages \
            --platform ios_13_0_arm64_iphoneos \
            --implementation cp --python-version 3.13 --abi cp313 \
            --only-binary=:all: \
            --extra-index-url https://pypi.anaconda.org/beeware/simple
          rm -rf app_packages/bin
          test -f app_packages/numpy/__init__.py
          echo "NumPy installed:"
          ls app_packages | head -30

      - name: test Python source and runner
        script: |
          set -euo pipefail
          BUILD_PYTHON="$PWD/.build-venv/bin/python"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX=/tmp/pyphone-pycache
          rm -rf "$PYTHONPYCACHEPREFIX"
          # The app_packages folder contains iOS-only wheels, so install a
          # separate host NumPy into the isolated build venv for test execution.
          "$BUILD_PYTHON" -m pip install --only-binary=:all: "numpy==2.5.2.post1"
          "$BUILD_PYTHON" -m py_compile app/runner.py app/ui.py scripts/test_runtime.py
          "$BUILD_PYTHON" scripts/test_runtime.py
          test -f app_packages/numpy/__init__.py
          find app_packages/numpy -type f -name '*.so' -print -quit | grep -q .
          echo "Python source, runner, UI callbacks, and NumPy package checks passed."

      - name: make Xcode 
        script: |
          set -euo pipefail
          xcodegen generate

      - name: make IPA
        script: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project PyPhone.xcodeproj \
            -scheme PyPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log
          test -d "build/Build/Products/Release-iphoneos/PyPhone.app" || {
            echo "xcodebuild finished without creating PyPhone.app. Last build log lines:"
            tail -100 /tmp/xcodebuild.log
            exit 1
          }

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/PyPhone.app"
          test -d "$APP_PATH" || {
            echo "PyPhone.app is missing; refusing to create a broken IPA."
            tail -100 /tmp/xcodebuild.log || true
            exit 1
          }
          rm -rf Payload PyPhone.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PyPhone.ipa Payload
          # Put the IPA inside a ZIP so Codemagic/iPhone can download it reliably.
          rm -f PyPhone_ipa.zip
          zip -qry PyPhone_ipa.zip PyPhone.ipa
          ls -lh PyPhone.ipa PyPhone_ipa.zip

      - name: Verify build before publishing artifacts
        script: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/PyPhone.app"

          echo "Checking app bundle..."
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          plutil -lint "$APP_PATH/Info.plist"
          test -f "$APP_PATH/python/lib/python3.13/encodings/__init__.py"
          test -f "$APP_PATH/python/lib/python3.13/datetime.py"
          test -f "$APP_PATH/app_packages/numpy/__init__.py"
          test -f "$APP_PATH/app_packages/numpy/_core/__init__.py"

          # This is an iOS device build, so the CI Mac cannot directly import
          # its ARM64 iOS extension modules. Verify the exact files needed by
          # Python's standard library and NumPy are bundled before packaging.
          echo "Checking Python standard-library native frameworks..."
          for module in math _datetime; do
            test -f "$APP_PATH/Frameworks/$module.framework/$module" || {
              echo "Python native framework is missing: $module"
              find "$APP_PATH/Frameworks" -maxdepth 1 \( -iname '*math*' -o -iname '*datetime*' \) -print
              exit 1
            }
          done

          echo "Checking native module marker files..."
          for module in math _datetime; do
            find "$APP_PATH/python/lib/python3.13/lib-dynload" -maxdepth 1 -type f -name "$module*.fwork" -print -quit | grep -q . || {
              echo "Python import marker is missing for $module"
              exit 1
            }
          done
          find "$APP_PATH/app_packages/numpy" -type f -name '*.fwork' -print -quit | grep -q . || {
            echo "NumPy native import markers are missing."
            exit 1
          }

          # Every .fwork marker must point to an existing framework binary,
          # and that framework must point back to the marker's original path.
          while IFS= read -r -d '' marker; do
            target="$(cat "$marker")"
            case "$target" in
              Frameworks/*.framework/*) ;;
              *) echo "Invalid framework target in $marker: $target"; exit 1 ;;
            esac
            test -f "$APP_PATH/$target" || {
              echo "Framework binary referenced by $marker is missing: $target"
              exit 1
            }
            test -f "$APP_PATH/$target.origin" || {
              echo "Framework origin file is missing: $target.origin"
              exit 1
            }
            origin="$(cat "$APP_PATH/$target.origin")"
            test -f "$APP_PATH/$origin" || {
              echo "Original .fwork marker referenced by $target.origin is missing: $origin"
              exit 1
            }
          done < <(find "$APP_PATH/python/lib/python3.13/lib-dynload" "$APP_PATH/app_packages" -type f -name '*.fwork' -print0)

          if find "$APP_PATH/python/lib/python3.13/lib-dynload" "$APP_PATH/app_packages" -type f -name '*.so' -print -quit | grep -q .; then
            echo "A native .so module was left outside the Frameworks directory."
            find "$APP_PATH/python/lib/python3.13/lib-dynload" "$APP_PATH/app_packages" -type f -name '*.so' -print | head -30
            exit 1
          fi

          echo "Checking NumPy native frameworks..."
          find "$APP_PATH/Frameworks" -maxdepth 1 -name 'numpy*framework' -print | grep -q .

          echo "Checking IPA archive and required app path..."
          test -s PyPhone.ipa
          unzip -tq PyPhone.ipa
          unzip -Z1 PyPhone.ipa | grep -Fxq "Payload/PyPhone.app/Info.plist"

          echo "Checking downloadable ZIP and embedded IPA..."
          test -s PyPhone_ipa.zip
          unzip -tq PyPhone_ipa.zip
          unzip -Z1 PyPhone_ipa.zip | grep -Fxq "PyPhone.ipa"
          unzip -p PyPhone_ipa.zip PyPhone.ipa > /tmp/PyPhone_check.ipa
          unzip -tq /tmp/PyPhone_check.ipa
          unzip -Z1 /tmp/PyPhone_check.ipa | grep -Fxq "Payload/PyPhone.app/Info.plist"

          echo "All checks passed. Ready for artifact publishing."
          echo "Final artifact sizes (bytes):"
          wc -c PyPhone.ipa PyPhone_ipa.zip
          echo "Final artifact SHA-256:"
          shasum -a 256 PyPhone.ipa PyPhone_ipa.zip
          # Publish checksums too, so a downloaded file can be compared with
          # the exact bytes that passed ZIP integrity checks on the build VM.
          shasum -a 256 PyPhone.ipa PyPhone_ipa.zip > PyPhone_SHA256.txt
          ls -lh PyPhone.ipa PyPhone_ipa.zip PyPhone_SHA256.txt

    artifacts:
      - PyPhone_ipa.zip
      - PyPhone.ipa
      - PyPhone_SHA256.txt
      - /tmp/xcodebuild.log
