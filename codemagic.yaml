workflows:
  ios-build:
    name: PyPhone iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: get build tools
        script: |
          set -euo pipefail
          brew install xcodegen python@3.13

      - name: get python and numpy
        script: |
          set -euo pipefail

          PYTHON_BIN="$(brew --prefix python@3.13)/bin/python3.13"
          "$PYTHON_BIN" --version

          # Use the known release URL directly to avoid GitHub API rate limits.
          ASSET_URL="https://github.com/beeware/Python-Apple-support/releases/download/3.13-b16/Python-3.13-iOS-support.b16.tar.gz"

          echo "Downloading Python support archive: $ASSET_URL"
          curl -fL "$ASSET_URL" -o Python-3.13-iOS-support.tar.gz
          mkdir -p py
          tar -xzf Python-3.13-iOS-support.tar.gz -C py

          # Locate the standard library by a file it must contain instead of
          # assuming the archive's internal folder layout.
          ENCODINGS="$(find py -type f -path '*/encodings/__init__.py' -print -quit)"
          if [ -z "$ENCODINGS" ]; then
            echo "Could not find encodings/__init__.py in the Python support archive."
            find py -type f -name '__init__.py' | head -100
            exit 1
          fi
          STDLIB="${ENCODINGS%/encodings/__init__.py}"
          mkdir -p python-stdlib/python3.13
          rsync -a "$STDLIB/" python-stdlib/python3.13/

          XCF="$(find py -maxdepth 7 -name Python.xcframework -type d -print -quit)"
          if [ -z "$XCF" ]; then
            echo "Python.xcframework not found in support archive."
            exit 1
          fi
          mv "$XCF" ./Python.xcframework

          test -f Python.xcframework/Info.plist
          test -f python-stdlib/python3.13/encodings/__init__.py

          # Use an isolated virtual environment so Homebrew's PEP 668
          # externally-managed-environment protection is not triggered.
          "$PYTHON_BIN" -m venv .build-venv
          BUILD_PYTHON="$PWD/.build-venv/bin/python"
          mkdir -p app_packages
          "$BUILD_PYTHON" -m pip install --upgrade pip
          "$BUILD_PYTHON" -m pip install -r requirements.txt \
            --target app_packages \
            --platform ios_13_0_arm64_iphoneos \
            --implementation cp --python-version 3.13 --abi cp313 \
            --only-binary=:all: \
            --extra-index-url https://pypi.anaconda.org/beeware/simple
          rm -rf app_packages/bin
          test -f app_packages/numpy/__init__.py
          echo "NumPy installed:"
          ls app_packages | head -30

      - name: make Xcode 
        script: |
          set -euo pipefail
          xcodegen generate

      - name: make IPA
        script: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project PyPhone.xcodeproj \
            -scheme PyPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log
          test -d "build/Build/Products/Release-iphoneos/PyPhone.app" || {
            echo "xcodebuild finished without creating PyPhone.app. Last build log lines:"
            tail -100 /tmp/xcodebuild.log
            exit 1
          }

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/PyPhone.app"
          test -d "$APP_PATH" || {
            echo "PyPhone.app is missing; refusing to create a broken IPA."
            tail -100 /tmp/xcodebuild.log || true
            exit 1
          }
          rm -rf Payload PyPhone.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PyPhone.ipa Payload
          ls -lh PyPhone.ipa
