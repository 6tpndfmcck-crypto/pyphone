name: PyPhone
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  PyPhone:
    type: application
    platform: iOS
    sources:
      - sources
      - path: app
        type: folder
      - path: app_packages
        type: folder
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: true
    info:
      path: sources/Info.plist
      properties:
        CFBundleDisplayName: PyPhone
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pyphone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: sources/Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Install Python standard library
        script: bash "$SRCROOT/scripts/install_python.sh"
        basedOnDependencyAnalysis: false
