[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyui-toolkit"
version = "0.1.0"
description = "A lightweight, pure-Python UI toolkit with pluggable rendering backends"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ui", "widgets", "gui", "pure-python", "pyphone"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
